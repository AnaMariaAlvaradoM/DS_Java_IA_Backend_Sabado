spring.application.name=atiende


spring.datasource.url=jdbc:mysql://localhost:3306/atiende_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.config.import=optional:file:./secrets.properties

atiende.ia.timeout-segundos=30
atiende.ia.max-tokens=1024

atiende.ia.openai.url=https://generativelanguage.googleapis.com/v1beta/openai
atiende.ia.openai.modelo=gemini-3.5-flash-lite
atiende.ia.openai.llave=sin-configurar
atiende.ia.openai.precio-entrada-millon=0.30
atiende.ia.openai.precio-salida-millon=2.50

atiende.ia.claude.url=http://localhost:11434
atiende.ia.claude.modelo=qwen3:1.7b
atiende.ia.claude.llave=ollama
atiende.ia.claude.precio-entrada-millon=0
atiende.ia.claude.precio-salida-millon=0